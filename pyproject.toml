[project]
name = "core-common-django-apps"
version = "0.1.0"
description = "Core django apps"
requires-python = ">=3.12,<4"
dependencies = [
    "django ( ==5.2.16)",
    "djangorestframework ( >= 3.17.1,<4.0.0)",
    "django-tenants (>= 3.10.2,<4.0.0)",
    "django-model-utils (>= 5.0.0,<6.0.0)",
    "pytest (>= 9.1.1,<10.0.0)",
    "pytest-django (>= 4.12.0,<5.0.0)",
    "dj-rest-auth (>= 7.2.0,<8.0.0)",
    "psycopg2-binary (>= 2.9.12,<3.0.0)",
    "watchdog (>= 6.0.0,<7.0.0)",
    "valkey (>= 6.1.1,<7.0.0)",
    "django-celery-results (>= 2.6.0,<3.0.0)",
    "celery (>= 5.6.3,<6.0.0)",
    "django-celery-beat (>= 2.9.0,<3.0.0)",
    "redis (>= 8.0.1,<9.0.0)",
    "factory-boy (>= 3.3.3,<4.0.0)",
    "django-constance (>= 4.3.5,<5.0.0)",
    "django-redis (>= 7.0.0,<8.0.0)",
    "debugpy (>= 1.8.21,<2.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "google-auth (>=2.62.0,<3.0.0)",
    "jinja2 (>= 3.1.5,<4.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "django-phonenumber-field (>=9.0.0,<10.0.0)",
    "phonenumbers (>=9.0.42,<10.0.0)",
]


[[project.authors]]
name = "Gurjot Singh"
email = "gurjotsingh855855@gmail.com"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
dev = [
    "pre-commit (>=4.6.2,<5.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "graphifyy (>=0.9.93,<0.10.0)",
]


[tool.isort]
profile = "black"
atomic = true
skip_glob = ["*/migrations/*", "*/db_migrations/*"]


[tool.pytest.ini_options]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "sample_project.config.settings.test"
python_files = ["test_*.py", "*_tests.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]
testpaths = ["tests", "core/tests"]
addopts = [
    "-vv",
    "--tb=short",
    "--strict-markers",
    "--reuse-db",
    "--import-mode=importlib",
    "-p no:warnings",
    "--maxfail=5",
]
markers = [
    "slow: marks tests that take longer to run",
    "integration: marks tests that hit multiple components",
    "unit: marks tests for isolated functions",
    "celery: marks tests that involve celery tasks",
]

[tool.poetry]
packages = [{ include = "core" }]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes (unused imports, undefined variables)
    "I",       # isort (import organization and sorting)
    "B",       # flake8-bugbear (common design traps and bug patterns)
    "DJ",      # flake8-django (Django anti-patterns, string null=True, etc.)
    "T20",     # flake8-print (disallows print / pprint in production)
    "T10",     # flake8-debugger (disallows breakpoint, pdb, ipdb)
    "PLC0415", # pylint: import-outside-top-level (strictly no local/nested imports)
    "TC",      # flake8-type-checking (enforces if TYPE_CHECKING for typing imports)
    "PT",      # flake8-pytest-style (pytest best practices)
]
ignore = [
    "E501",  # line length (handled by ruff format)
    "E203",  # whitespace before ':'
    "B009",  # getattr-with-constant: Allow getattr(obj, "field")
    "B010",  # setattr-with-constant: Allow setattr(obj, "field", value)
    "DJ001", # Avoid using `null=True` on string-based fields such as `TextField`
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
# Ignore undefined-from-star-import (F405) and star-imports (F403) in settings
"**/settings/*.py" = ["F403", "F405"]
"**/core/utils/dirtyfields/*.py" = ["B007", "B028"]
"sample_project/manage.py" = ["PLC0415"]
