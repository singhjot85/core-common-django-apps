services:
  pg_dump:
    image: postgres:16-alpine
    env_file:
      - .env
    secrets:
      - db_env
    environment:
      DB_NAME: ${DB_NAME:-}
    volumes:
      - ${PG_DUMP_DIR:-./pg_dump}:/backups
      - ./scripts:/scripts:ro
    networks:
      - app_network
    entrypoint: ["/bin/sh", "/scripts/pg_dump.sh"]

  pg_restore:
    image: postgres:16-alpine
    env_file:
      - .env
    secrets:
      - db_env
    environment:
      DB_NAME: ${DB_NAME:-}
      BACKUP_FILE: ${BACKUP_FILE:-}
    volumes:
      - ${PG_DUMP_DIR:-./pg_dump}:/backups
      - ./scripts:/scripts:ro
    networks:
      - app_network
    entrypoint: ["/bin/sh", "/scripts/pg_restore.sh"]

  pg_delete:
    image: postgres:16-alpine
    env_file:
      - .env
    secrets:
      - db_env
    environment:
      DB_NAME: ${DB_NAME:-}
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - app_network
    entrypoint: ["/bin/sh", "/scripts/pg_delete.sh"]

secrets:
  db_env:
    file: ./.env

networks:
  app_network:
    external: true
    name: ${DOCKER_NETWORK:-core_common_default}
