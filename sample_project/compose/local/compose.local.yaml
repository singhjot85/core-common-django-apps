volumes:
  pg_data:
    name: ${STACK_NAME:-core}_local_pg_data

services:
  django: &Django
    build:
      context: ../../..
      dockerfile: sample_project/compose/local/backend/Dockerfile
    container_name: ${STACK_NAME:-core}_django
    restart: on-failure:3
    env_file:
      - ./backend/.env
      - ./database/.env
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python sample_project/manage.py check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ../../..:/backend
      - ./backend/scripts:/scripts
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_DEBUG=True
      - WATCHFILES_FORCE_POLLING=true
      - PYTHONPATH=/backend
      - DJANGO_SETTINGS_MODULE=sample_project.config.settings.local
      - ENABLE_DEBUGPY=0
    ports:
      - "${DJANGO_PORT:-8000}:8000"

  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-core}_postgres
    env_file:
      - ./database/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  cache:
    image: valkey/valkey:8.1.5-alpine
    pull_policy: if_not_present
    container_name: ${STACK_NAME:-core}_valkey_cache
    ports:
      - "${CACHE_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  broker:
    image: valkey/valkey:8.1.5-alpine
    pull_policy: if_not_present
    container_name: ${STACK_NAME:-core}_valkey_broker
    command: valkey-server --port 6378 --appendonly yes
    ports:
      - "${BROKER_PORT:-6378}:6378"
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6378", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  celeryworker:
    <<: *Django
    command: /scripts/worker-start.sh
    container_name: ${STACK_NAME:-core}_celeryworker
    ports:
      - "${CELERY_PORT:-5555}:5555"
    depends_on:
      django:
        condition: service_healthy
      broker:
        condition: service_healthy

  # TODO: CronJobs will setup at last using celerybeat
